name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - Embedded server
        - Self-hosted (Docker / HA add-on)
        - nolongerevil.com
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Event Log
      description: With debug logging on if you can (Plugins → NoLongerEvil Nest → Toggle Debug Logging).
      render: text
